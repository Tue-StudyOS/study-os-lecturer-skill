[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturer-feedback"
version = "0.1.0"
description = "Aggregate, privacy-conscious learning feedback from task-based chat logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.7.0",
]

[project.scripts]
lecturer-feedback = "lecturer_feedback.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lecturer_feedback*"]
